        service_address: null         # specimen placeholder ("1 RUE ... CP VILLE")
        usage_amount: "11897"         # "Conso 11 897 kWh" stated total (HPH 9 711 + HCH 2 186)
        usage_unit: kWh
        billing_period_start: "2023-01-12"
        billing_period_end: "2023-02-11"

  # --- deliberate edge cases (scored only in edge-case runs) ---
  # cub-comed-us-electric-es.pdf is intentionally NOT numerically scored: it is a
  # rate explainer with an all-placeholder template bill, so "one electricity row
  # of nulls" and "no rows at all" are equally correct shapes. Its real test —
  # does the model hallucinate the 800 kWh tier boundary or the 00/00/0000
  # dates? — is verified behaviorally in TESTING.md.

  - file: ppl-us-electric-en.pdf
