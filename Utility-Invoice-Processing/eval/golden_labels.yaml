# Hand-labeled ground truth, established by visually reading every bill
# (not from any model output). One entry per (file x commodity row).
#
# Matching semantics (see evaluate.py):
#   vendor_name       list of accepted aliases; folded substring match
#   service_address   distinctive substring of the true address (punctuation-insensitive);
#                     null when the bill genuinely lacks a labeled service address
#   dates             exact ISO string match
#   usage_amount      Decimal-equality match
#   usage_unit        canonical label, case-insensitive match
#   null              the field is genuinely absent from the document; a predicted
#                     value there counts as a hallucination
#
# Judgment calls are documented in TESTING.md ("Golden-label judgment calls").

files:
  - file: centralhudson-us-electric-en.pdf
    language: en
    rows:
      - utility_type: electricity
        vendor_name: ["Central Hudson", "Central Hudson Gas & Electric"]
        invoice_date: null            # no bill/statement date is printed anywhere
        service_address: null         # "Service For:" block is a redacted placeholder
        usage_amount: "458"
        usage_unit: kWh
        billing_period_start: "2021-05-25"
        billing_period_end: "2021-06-22"

  - file: weenergies-us-electric-gas-en.pdf
    language: en
    rows:
      - utility_type: electricity
        vendor_name: ["We Energies"]
        invoice_date: "2026-02-03"
        service_address: "123 Main St"
        usage_amount: "669"
        usage_unit: kWh
        billing_period_start: "2026-01-05"
        billing_period_end: "2026-02-02"
      - utility_type: gas
        vendor_name: ["We Energies"]
        invoice_date: "2026-02-03"
        service_address: "123 Main St"
        usage_amount: "83.9"          # billing headline; 79 CCF is the metered alternate
        usage_unit: therms
        billing_period_start: "2026-01-05"
        billing_period_end: "2026-02-02"

  - file: midamerican-us-electric-en.pdf
    language: en
    rows:
      - utility_type: electricity
        vendor_name: ["MidAmerican Energy", "MidAmerican Energy Company"]
        invoice_date: "2025-04-04"    # "Date Billed: 04/04/25" (2-digit year)
        service_address: "Sioux City" # street line is font-garbled in the text layer
        usage_amount: "389"
        usage_unit: kWh
        billing_period_start: "2025-03-06"   # derived from the two meter-read dates
        billing_period_end: "2025-04-04"
      - utility_type: gas
        vendor_name: ["MidAmerican Energy", "MidAmerican Energy Company"]
        invoice_date: "2025-04-04"
        service_address: "Sioux City"
        usage_amount: "61"            # Total Therms; 59 ccf is the metered alternate
        usage_unit: therms
        billing_period_start: "2025-03-06"
        billing_period_end: "2025-04-04"

  - file: sfpuc-us-water-en.pdf
    language: en
    rows:
      - utility_type: water
        vendor_name:
          ["San Francisco Public Utilities Commission", "SFPUC",
           "San Francisco Water Power and Sewer", "San Francisco Water, Power and Sewer"]
        invoice_date: "2017-01-02"    # "Bill Date: 01/02/2017", US MDY
        service_address: "525 Golden Gate Ave"
        usage_amount: "6.40"          # "Total consumption in units of water 6.40"
        usage_unit: units             # SFPUC's fractional-billing unit (1 unit = 1 CCF)
        billing_period_start: "2016-12-02"
        billing_period_end: "2017-01-02"
      - utility_type: sewer
        vendor_name:
          ["San Francisco Public Utilities Commission", "SFPUC",
           "San Francisco Water Power and Sewer", "San Francisco Water, Power and Sewer"]
        invoice_date: "2017-01-02"
        service_address: "525 Golden Gate Ave"
        usage_amount: "5.76"          # "Total Discharge units 5.76 (6.40 units x 90%)"
        usage_unit: units
        billing_period_start: "2016-12-02"
        billing_period_end: "2017-01-02"

  - file: exodo-es-electricity-es.pdf
    language: es
    rows:
      - utility_type: electricity
        vendor_name: ["Iberdrola", "Iberdrola Clientes S.A.U."]
