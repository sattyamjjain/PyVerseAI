[project]
name = "invoice-extractor"
version = "0.1.0"
description = "LLM-powered multilingual utility invoice extraction: PDFs in any language -> validated CSV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sattyam Jain", email = "sattyamjain96@gmail.com" }]
dependencies = [
    "anthropic>=0.69",
    "openai>=1.68",
    "pydantic>=2.8",
    "pdfplumber>=0.11.4",
    "dateparser>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
invoice-extract = "invoice_extractor.cli:main"
invoice-eval = "invoice_extractor.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# UI file: long CSS/HTML string literals are clearer unwrapped
"app/streamlit_app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real LLM APIs (needs keys; costs money). Skipped by default."]
addopts = "-m 'not live'"
